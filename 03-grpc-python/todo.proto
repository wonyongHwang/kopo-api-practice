syntax = "proto3";

package todo;

service TodoService {
  rpc ListTodos (Empty) returns (TodoList) {}
  rpc AddTodo (NewTodo) returns (Todo) {}
}

message Empty {}

message Todo {
  int32 id = 1;
  string title = 2;
  bool done = 3;
}

message NewTodo {
  string title = 1;
}

message TodoList {
  repeated Todo items = 1;
}
